name: publish-0.1.0-clients

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.1.0-clients.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build macOS Universal app
        shell: bash
        run: |
          mkdir -p build/amd64 build/arm64 "dist/YunDongIP.app/Contents/MacOS" "dist/YunDongIP.app/Contents/Resources"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.0 -X main.buildCommit=${GITHUB_SHA}" -o build/amd64/YunDongIP ./cmd/yundongip
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=0.1.0 -X main.buildCommit=${GITHUB_SHA}" -o build/arm64/YunDongIP ./cmd/yundongip
          lipo -create -output "dist/YunDongIP.app/Contents/Resources/YunDongIP-core" build/amd64/YunDongIP build/arm64/YunDongIP
          cp clients/macos/launcher.sh "dist/YunDongIP.app/Contents/MacOS/YunDongIP"
          cp clients/macos/Info.plist "dist/YunDongIP.app/Contents/Info.plist"
          chmod +x "dist/YunDongIP.app/Contents/MacOS/YunDongIP" "dist/YunDongIP.app/Contents/Resources/YunDongIP-core"
          codesign --force --deep --sign - "dist/YunDongIP.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/YunDongIP.app" "dist/YunDongIP-0.1.0-macOS-universal.zip"
      - uses: actions/attest@v4
        with:
          subject-path: dist/YunDongIP-0.1.0-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/YunDongIP-0.1.0-macOS-universal.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone Android APK
        shell: bash
        run: |
          mkdir -p clients/android/app/src/main/jniLibs/arm64-v8a dist
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildmode=pie -trimpath -ldflags="-s -w -X main.buildVersion=0.1.0 -X main.buildCommit=${GITHUB_SHA}" -o clients/android/app/src/main/jniLibs/arm64-v8a/libyundongip.so ./cmd/yundongip
          cd clients/android
          gradle --no-daemon assembleDebug
          cd ../..
          cp clients/android/app/build/outputs/apk/debug/app-debug.apk dist/YunDongIP-0.1.0-android-arm64.apk
      - uses: actions/attest@v4
        with:
          subject-path: dist/YunDongIP-0.1.0-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/YunDongIP-0.1.0-android-arm64.apk

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source bundles
        shell: bash
        run: |
          mkdir -p dist pure
          cp -r cmd pure/
          cp go.mod pure/
          cp -r clients pure/
          (cd pure && zip -r ../dist/YunDongIP-0.1.0-pure-source-all-clients.zip .)
          git archive --format=zip --output=dist/YunDongIP-0.1.0-protected-source-all-clients.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: release-sources
          path: dist/*.zip

  publish:
    needs: [macos, android, sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum YunDongIP-0.1.0-macOS-universal.zip YunDongIP-0.1.0-android-arm64.apk YunDongIP-0.1.0-pure-source-all-clients.zip YunDongIP-0.1.0-protected-source-all-clients.zip > SHA256SUMS-clients.txt
      - name: Upload to existing 0.1.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload 0.1.0             dist/YunDongIP-0.1.0-macOS-universal.zip             dist/YunDongIP-0.1.0-android-arm64.apk             dist/YunDongIP-0.1.0-pure-source-all-clients.zip             dist/YunDongIP-0.1.0-protected-source-all-clients.zip             dist/SHA256SUMS-clients.txt             --clobber --repo zeruiouo-blip/YunDongIP
